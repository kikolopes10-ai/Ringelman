<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>Ringelmann Pro Logo Timestamp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; }
    body {
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #container {
      position: relative;
      flex: 1;
      overflow: hidden;
    }
    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    #svgWrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
    }
    #infoPanel {
      position: relative;
      z-index: 10;
      padding: 10px 12px;
      background: rgba(0,0,0,0.88);
      border-top: 1px solid #444;
      flex-shrink: 0;
    }
    .btns { display: flex; gap: 8px; margin-top: 6px; }
    button, label.btn-file {
      flex: 1;
      padding: 12px;
      font-size: 13px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: #fff;
      font-weight: bold;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #btnGPS { background: #1e88e5; }
    #btnCapture { background: #2e7d32; }
    .btn-file { background: #7b1fa2; } /* Cor roxa para o botão de logo */
    
    #status { font-size: 11px; color: #aaa; margin-top: 4px; }
    canvas { display: none; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

<div id="container">
  <video id="video" autoplay playsinline muted></video>
  <div id="svgWrap"></div>
</div>

<div id="infoPanel">
  <div style="font-size: 13px; margin-bottom: 5px;">
    <strong>Data/Hora:</strong> <span id="datetime">--/--/---- --:--:--</span><br>
    <strong>Lat:</strong> <span id="lat">--</span>&nbsp; <strong>Lon:</strong> <span id="lon">--</span>
  </div>
  
  <div class="btns">
    <label class="btn-file">
      Selo/Logo
      <input type="file" id="logoInput" accept="image/*">
    </label>
    <button id="btnGPS">Atualizar GPS</button>
    <button id="btnCapture">Capturar</button>
  </div>
  <div id="status">Iniciando...</div>
</div>

<canvas id="canvasCapture"></canvas>

<script>
  let logoImg = null;

  // Carregar imagem do Logo
  document.getElementById('logoInput').addEventListener('change', function(e) {
    const reader = new FileReader();
    reader.onload = function(event) {
      logoImg = new Image();
      logoImg.src = event.target.result;
      document.getElementById('status').textContent = "Logo carregado com sucesso!";
    }
    reader.readAsDataURL(e.target.files[0]);
  });

  function updateDateTime() {
    const now = new Date();
    const p = n => String(n).padStart(2,'0');
    document.getElementById('datetime').textContent =
      `${p(now.getDate())}/${p(now.getMonth()+1)}/${now.getFullYear()} ` +
      `${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;
  }
  setInterval(updateDateTime, 1000);
  updateDateTime();

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } }, audio: false
      });
      document.getElementById('video').srcObject = stream;
      setTimeout(buildScale, 500);
    } catch(e) {
      document.getElementById('status').textContent = 'Erro câmera: ' + e.message;
    }
  }

  function getLocation() {
    navigator.geolocation.getCurrentPosition(
      pos => {
        document.getElementById('lat').textContent = pos.coords.latitude.toFixed(6);
        document.getElementById('lon').textContent = pos.coords.longitude.toFixed(6);
        document.getElementById('status').textContent = 'GPS atualizado.';
      },
      err => { document.getElementById('status').textContent = 'Erro GPS: ' + err.message; },
      { enableHighAccuracy: true }
    );
  }
  document.getElementById('btnGPS').addEventListener('click', getLocation);

  function buildScale() {
    const wrap = document.getElementById('svgWrap');
    const cont = document.getElementById('container');
    const size = Math.min(cont.clientWidth, cont.clientHeight) * 0.92;
    if (!size) return;

    const ns  = 'http://www.w3.org/2000/svg';
    const cx  = size / 2; const cy  = size / 2;
    const R   = size / 2 - 2; const Ro  = R * 0.82; const Ri  = R * 0.45; 
    const N   = 5; const startAngle = -Math.PI / 2;

    const svg = document.createElementNS(ns, 'svg' );
    svg.setAttribute('id', 'ringelmannSVG');
    svg.setAttribute('width', size); svg.setAttribute('height', size);
    svg.setAttribute('viewBox', `0 0 ${size} ${size}`);

    const toXY = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];

    const outerRing = document.createElementNS(ns, 'path');
    outerRing.setAttribute('d', `M ${cx} ${cy-R} A ${R} ${R} 0 1 1 ${cx} ${cy+R} A ${R} ${R} 0 1 1 ${cx} ${cy-R} Z M ${cx} ${cy-Ro} A ${Ro} ${Ro} 0 1 0 ${cx} ${cy+Ro} A ${Ro} ${Ro} 0 1 0 ${cx} ${cy-Ro} Z`);
    outerRing.setAttribute('fill', '#ffffff'); outerRing.setAttribute('stroke', '#000000'); outerRing.setAttribute('stroke-width', 1.5);
    svg.appendChild(outerRing);

    const segs = [
      { color: '#d8d8d8', label: 'Nº1', dens: '20%' }, { color: '#aaaaaa', label: 'Nº2', dens: '40%' }, 
      { color: '#787878', label: 'Nº3', dens: '60%' }, { color: '#484848', label: 'Nº4', dens: '80%' }, 
      { color: '#000000', label: 'Nº5', dens: '100%' }  
    ];

    const step = (2 * Math.PI) / N;
    segs.forEach((seg, i) => {
      const a0 = startAngle + i * step; const a1 = startAngle + (i + 1) * step;
      const d = `M ${toXY(Ro, a0)[0]} ${toXY(Ro, a0)[1]} A ${Ro} ${Ro} 0 0 1 ${toXY(Ro, a1)[0]} ${toXY(Ro, a1)[1]} L ${toXY(Ri, a1)[0]} ${toXY(Ri, a1)[1]} L ${toXY(Ri, a0)[0]} ${toXY(Ri, a0)[1]} Z`;
      const path = document.createElementNS(ns, 'path');
      path.setAttribute('d', d); path.setAttribute('fill', seg.color); path.setAttribute('stroke', '#ffffff'); path.setAttribute('stroke-width', 1.2);
      svg.appendChild(path);

      const pathId = `textArc${i}`;
      const arcPath = document.createElementNS(ns, 'path');
      arcPath.setAttribute('id', pathId);
      arcPath.setAttribute('d', `M ${toXY((Ro+R)/2, a0+0.08)[0]} ${toXY((Ro+R)/2, a0+0.08)[1]} A ${(Ro+R)/2} ${(Ro+R)/2} 0 0 1 ${toXY((Ro+R)/2, a1-0.08)[0]} ${toXY((Ro+R)/2, a1-0.08)[1]}`);
      arcPath.setAttribute('fill', 'none');
      svg.appendChild(arcPath);

      const textEl = document.createElementNS(ns, 'text');
      const tp = document.createElementNS(ns, 'textPath');
      tp.setAttribute('href', `#${pathId}`); tp.setAttribute('startOffset', '50%'); tp.setAttribute('text-anchor', 'middle');
      tp.textContent = `${seg.label} DENS. ${seg.dens}`;
      textEl.setAttribute('font-size', size * 0.032); textEl.setAttribute('font-weight', 'bold');
      textEl.appendChild(tp); svg.appendChild(textEl);
    });

    wrap.innerHTML = '';
    wrap.appendChild(svg);
  }

  function capturePhoto() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvasCapture');
    const ctx = canvas.getContext('2d');
    const svg = document.getElementById('ringelmannSVG');
    
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    const svgData = new XMLSerializer().serializeToString(svg);
    const imgScale = new Image();
    const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);

    imgScale.onload = function() {
      // 1. Desenha a escala Ringelmann no centro
      const sSize = Math.min(canvas.width, canvas.height) * 0.9;
      ctx.drawImage(imgScale, (canvas.width - sSize) / 2, (canvas.height - sSize) / 2, sSize, sSize);
      
      const margin = 30;
      
      // 2. Desenha o LOGO (Selo) se existir - Canto Superior Direito
      if (logoImg) {
        const logoW = canvas.width * 0.15; // Define largura do logo como 15% da foto
        const logoH = (logoImg.height * logoW) / logoImg.width;
        ctx.drawImage(logoImg, canvas.width - logoW - margin, margin, logoW, logoH);
      }

      // 3. Desenha DATA e GPS - Canto Inferior Direito
      const fontSize = Math.max(canvas.width * 0.025, 20);
      ctx.font = `bold ${fontSize}px Arial`;
      ctx.textAlign = "right";
      ctx.textBaseline = "bottom";
      ctx.lineWidth = 4;
      ctx.strokeStyle = "black";
      ctx.fillStyle = "white";

      const now = new Date();
      const p = n => String(n).padStart(2,'0');
      const dateStr = `${p(now.getDate())}/${p(now.getMonth()+1)}/${now.getFullYear()} ${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;
      
      const latVal = parseFloat(document.getElementById('lat').textContent);
      const lonVal = parseFloat(document.getElementById('lon').textContent);
      const latF = isNaN(latVal) ? "--" : latVal.toFixed(6).replace('.',',') + (latVal < 0 ? "S" : "N");
      const lonF = isNaN(lonVal) ? "--" : lonVal.toFixed(6).replace('.',',') + (lonVal < 0 ? "W" : "E");
      const gpsStr = `${latF} ${lonF}`;

      ctx.strokeText(dateStr, canvas.width - margin, canvas.height - margin - fontSize - 10);
      ctx.fillText(dateStr, canvas.width - margin, canvas.height - margin - fontSize - 10);
      ctx.strokeText(gpsStr, canvas.width - margin, canvas.height - margin);
      ctx.fillText(gpsStr, canvas.width - margin, canvas.height - margin);

      const link = document.createElement('a');
      link.download = `Laudo_Ringelmann_${Date.now()}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
      URL.revokeObjectURL(url);
    };
    imgScale.src = url;
  }

  document.getElementById('btnCapture').addEventListener('click', capturePhoto);
  window.addEventListener('resize', buildScale);
  startCamera();
  getLocation();
</script>
</body>
</html>
Dica: Use uma imagem com fundo transparente (PNG) para que o resultado fique
mais profissional!
