<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>Câmera Escala Ringelmann</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      height: 100%;
      background: #000;
    }

    body {
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #container {
      position: relative;
      flex: 1; /* Ocupa o topo */
      overflow: hidden;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #svgWrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5; /* Fica acima do vídeo */
    }

    #infoPanel {
      position: relative;
      z-index: 10; /* Fica acima de tudo */
      padding: 10px;
      background: rgba(0,0,0,0.9);
      border-top: 1px solid #444;
      min-height: 110px; /* Garante espaço para os botões */
    }

    .btns { 
      display: flex; 
      gap: 10px; 
      margin-top: 8px; 
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: #fff;
      font-weight: bold;
    }

    #btnGPS { background: #1e88e5; }
    #btnCapture { background: #2e7d32; }
    
    #status { font-size: 11px; color: #aaa; margin-top: 5px; }
    canvas { display: none; }
  </style>
</head>
<body>

<div id="container">
  <video id="video" autoplay playsinline muted></video>
  <div id="svgWrap"></div>
</div>

<div id="infoPanel">
  <div style="font-size: 13px;"><strong>Data:</strong> <span id="datetime">--/--/---- --:--</span></div>
  <div style="font-size: 13px;"><strong>Lat:</strong> <span id="lat">--</span> | <strong>Lon:</strong> <span id="lon">--</span></div>
  
  <div class="btns">
    <button id="btnGPS">GPS</button>
    <button id="btnCapture">CAPTURAR</button>
  </div>
  <div id="status">Iniciando...</div>
</div>

<canvas id="canvasCapture"></canvas>

<script>
  // 1. Atualizar Data
  function updateDateTime() {
    const now = new Date();
    const p = n => String(n).padStart(2,'0');
    document.getElementById('datetime').textContent =
      `${p(now.getDate())}/${p(now.getMonth()+1)}/${now.getFullYear()} ${p(now.getHours())}:${p(now.getMinutes())}`;
  }
  setInterval(updateDateTime, 1000);
  updateDateTime();

  // 2. Iniciar Câmera
  async function startCamera() {
    const status = document.getElementById('status');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' }, audio: false
      });
      document.getElementById('video').srcObject = stream;
      status.textContent = 'Câmera OK.';
      setTimeout(buildScale, 500);
    } catch(e) {
      status.textContent = 'Erro Câmera: ' + e.message;
    }
  }

  // 3. Localização
  function getLocation() {
    const status = document.getElementById('status');
    navigator.geolocation.getCurrentPosition(
      pos => {
        document.getElementById('lat').textContent = pos.coords.latitude.toFixed(5);
        document.getElementById('lon').textContent = pos.coords.longitude.toFixed(5);
        status.textContent = 'GPS OK.';
      },
      err => { status.textContent = 'Erro GPS: Ative a localização.'; },
      { enableHighAccuracy: true }
    );
  }
  document.getElementById('btnGPS').addEventListener('click', getLocation);

  // 4. Desenhar Escala (Seu SVG original)
  function buildScale() {
    const wrap = document.getElementById('svgWrap');
    const cont = document.getElementById('container');
    const size = Math.min(cont.clientWidth, cont.clientHeight) * 0.9;
    if (!size) return;

    const ns  = 'http://www.w3.org/2000/svg';
    const cx  = size / 2;
    const cy  = size / 2;
    const R   = size / 2 - 2;      
    const Ro  = R * 0.82;          
    const Ri  = R * 0.45; 

    const svg = document.createElementNS(ns, 'svg' );
    svg.setAttribute('id', 'ringelmannSVG');
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
    svg.setAttribute('viewBox', `0 0 ${size} ${size}`);

    const toXY = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    const startAngle = -Math.PI / 2;

    // Disco branco externo
    const outerRing = document.createElementNS(ns, 'path');
    outerRing.setAttribute('d', `M ${cx} ${cy-R} A ${R} ${R} 0 1 1 ${cx} ${cy+R} A ${R} ${R} 0 1 1 ${cx} ${cy-R} Z M ${cx} ${cy-Ro} A ${Ro} ${Ro} 0 1 0 ${cx} ${cy+Ro} A ${Ro} ${Ro} 0 1 0 ${cx} ${cy-Ro} Z`);
    outerRing.setAttribute('fill', '#fff');
    outerRing.setAttribute('stroke', '#000');
    svg.appendChild(outerRing);

    const segs = [
      { color: '#d8d8d8', label: '1' }, { color: '#aaaaaa', label: '2' }, 
      { color: '#787878', label: '3' }, { color: '#484848', label: '4' }, 
      { color: '#000000', label: '5' }
    ];

    const step = (2 * Math.PI) / 5;
    segs.forEach((seg, i) => {
      const a0 = startAngle + i * step;
      const a1 = startAngle + (i + 1) * step;
      const d = `M ${toXY(Ro, a0)[0]} ${toXY(Ro, a0)[1]} A ${Ro} ${Ro} 0 0 1 ${toXY(Ro, a1)[0]} ${toXY(Ro, a1)[1]} L ${toXY(Ri, a1)[0]} ${toXY(Ri, a1)[1]} A ${Ri} ${Ri} 0 0 0 ${toXY(Ri, a0)[0]} ${toXY(Ri, a0)[1]} Z`;
      const path = document.createElementNS(ns, 'path');
      path.setAttribute('d', d);
      path.setAttribute('fill', seg.color);
      path.setAttribute('stroke', '#fff');
      svg.appendChild(path);

      const text = document.createElementNS(ns, 'text');
      const [tx, ty] = toXY((Ro + R) / 2, a0 + step / 2);
      text.setAttribute('x', tx); text.setAttribute('y', ty);
      text.setAttribute('text-anchor', 'middle'); text.setAttribute('dominant-baseline', 'central');
      text.setAttribute('fill', '#000'); text.setAttribute('font-weight', 'bold');
      text.textContent = seg.label;
      svg.appendChild(text);
    });

    wrap.innerHTML = '';
    wrap.appendChild(svg);
  }

  // 5. Captura de Foto
  function capturePhoto() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvasCapture');
    const ctx = canvas.getContext('2d');
    const svg = document.getElementById('ringelmannSVG');
    const status = document.getElementById('status');

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);

    const svgData = new XMLSerializer().serializeToString(svg);
    const img = new Image();
    const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);

    img.onload = function() {
      const s = Math.min(canvas.width, canvas.height) * 0.9;
      ctx.drawImage(img, (canvas.width-s)/2, (canvas.height-s)/2, s, s);
      
      ctx.fillStyle = "rgba(0,0,0,0.8)";
      ctx.fillRect(0, canvas.height - 60, canvas.width, 60);
      ctx.fillStyle = "white";
      ctx.font = "20px Arial";
      const info = document.getElementById('datetime').textContent + " | LAT: " + document.getElementById('lat').textContent + " LON: " + document.getElementById('lon').textContent;
      ctx.fillText(info, 20, canvas.height - 25);

      const link = document.createElement('a');
      link.download = 'Ringelmann_Captura.png';
      link.href = canvas.toDataURL();
      link.click();
      URL.revokeObjectURL(url);
      status.textContent = 'Foto salva!';
    };
    img.src = url;
  }

  document.getElementById('btnCapture').addEventListener('click', capturePhoto);
  window.addEventListener('resize', buildScale);
  
  startCamera();
  getLocation();
</script>
</body>
</html>
